name: Deploy Backend to Vercel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: Test & Deploy Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_github_workflow_jwt_secret_test_32_characters

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID || 'team_HHzmmNEL2uwikvSi7jOdgOp7' }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID || 'prj_Hmc1u03v5lOpLZi3otjpDs8dPoGR' }}
          vercel-args: '--prod'
          working-directory: ./backend
