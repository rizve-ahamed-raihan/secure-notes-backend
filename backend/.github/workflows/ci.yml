name: CI - Backend Test & Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Tests & Index Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute test suite (RBAC, Indexes, Aggregations)
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_key_32_characters_minimum
